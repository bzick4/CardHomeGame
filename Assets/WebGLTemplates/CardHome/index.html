<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <!-- Телефон: страница не масштабируется пальцами, холст занимает весь экран. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #141b33;
        /* Никакой прокрутки, выделения и масштабирования жестами — всё касание уходит в игру. */
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none;
      }
      /* Холст всегда на весь экран (и в окне itch.io): при повороте телефона он меняет размер,
         Unity подстраивает картинку, а игра сама выбирает вертикальную или горизонтальную раскладку. */
      #unity-canvas {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; outline: none; background: #141b33;
      }
      /* Экран, пока браузер скачивает игру: та же картинка, что у загрузки внутри игры.
         Блок с названием — в спокойной части неба: в вертикали над домом, в горизонтали слева. */
      #loader {
        position: fixed; inset: 0;
        background: #141b33 url("loading.jpg") center / cover no-repeat;
        font-family: "Noto Sans", "Trebuchet MS", system-ui, sans-serif; color: #fff3dc;
        transition: opacity .4s ease;
      }
      #loader .panel {
        position: absolute; left: 50%; top: 11%; transform: translateX(-50%);
        width: min(90vw, 560px);
        display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.2vh, 22px);
      }
      @media (orientation: landscape) {
        #loader { background-image: url("loading-wide.jpg"); }
        #loader .panel { left: 27%; top: 50%; transform: translate(-50%, -50%); width: min(46vw, 560px); }
      }
      #loader .icon {
        width: clamp(72px, 20vmin, 150px); aspect-ratio: 1; border-radius: 22%;
        box-shadow: 0 6px 18px rgba(0,0,0,.55);
      }
      /* Название — на красной ленте, как заголовки окон в игре. */
      #loader .ribbon {
        width: 100%; aspect-ratio: 713 / 192;
        background: url("ribbon.png") center / 100% 100% no-repeat;
        display: flex; align-items: center; justify-content: center; padding-bottom: 4%; box-sizing: border-box;
      }
      #loader .title {
        font-size: clamp(22px, 5.6vmin, 40px); font-weight: 800; letter-spacing: .06em;
        text-shadow: 0 2px 0 #3b1a10, 2px 0 0 #3b1a10, -2px 0 0 #3b1a10, 0 -2px 0 #3b1a10, 0 4px 8px rgba(0,0,0,.45);
      }
      /* Полоса загрузки — в рамке шкалы из игры, внутри золотая заливка. */
      #loader .bar {
        position: relative; width: 92%; aspect-ratio: 398 / 56;
        background: url("bar.png") center / 100% 100% no-repeat;
      }
      #loader .track { position: absolute; left: 7%; right: 7%; top: 30%; bottom: 30%; border-radius: 99px; overflow: hidden; }
      #loader .fill {
        width: 0; height: 100%; border-radius: 99px;
        background: linear-gradient(#ffe08a, #ffb834 55%, #e8901c);
        box-shadow: 0 0 10px rgba(255,200,90,.7); transition: width .2s ease;
      }
      #loader .tip {
        width: 100%; box-sizing: border-box; padding: 14px 26px; text-align: center;
        background: url("plate.png") center / 100% 100% no-repeat; opacity: .95;
        font-size: clamp(14px, 3.4vmin, 19px); line-height: 1.35; font-weight: 600;
        text-shadow: 0 2px 2px rgba(0,0,0,.6);
      }
      #loader .tip b { color: #ffd34d; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader">
      <div class="panel">
        <img class="icon" src="favicon.png" alt="">
        <div class="ribbon"><div class="title">ДОМ НА НОЧЬ</div></div>
        <div class="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
        <div class="tip"><b>Загрузка…</b> <span id="tip"></span></div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#fill");

      // Совет на время загрузки — как на экране загрузки в самой игре.
      var tips = [
        "Карта на такую же комнату складывает уровни: I + I = II.",
        "Ловушка на пути вора поймает его и принесёт золото.",
        "Кухня рядом со столовой радует гостей вдвое.",
        "Долгое нажатие на карту — посмотреть её крупно.",
        "Играть можно и вертикально, и горизонтально."
      ];
      document.querySelector("#tip").textContent = tips[Math.floor(Math.random() * tips.length)];

      // Свайпы и двойной тап не должны двигать страницу.
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Размер картинки следует за размером холста (поворот, окно itch, полноэкранный режим).
        matchWebGLToCanvasSize: true,
        // Чёткость на телефонах, но не больше 2× — иначе слабые телефоны тормозят.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function () {
          loader.style.opacity = "0";
          setTimeout(function () { loader.remove(); }, 450);
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
