<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <!-- Телефон: страница не масштабируется пальцами, холст занимает весь экран. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #141b33;
        /* Никакой прокрутки, выделения и масштабирования жестами — всё касание уходит в игру. */
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none;
      }
      /* Холст всегда на весь экран (и в окне itch.io): при повороте телефона он меняет размер,
         Unity подстраивает картинку, а игра сама выбирает вертикальную или горизонтальную раскладку. */
      #unity-canvas {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; outline: none; background: #141b33;
      }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px;
        background: linear-gradient(#141b33 0%, #223056 45%, #4a4670 70%, #eaa36a 100%);
        font-family: "Noto Sans", system-ui, sans-serif; color: #f4eadc;
        transition: opacity .4s ease;
      }
      #loader .title { font-size: clamp(24px, 6vw, 44px); font-weight: 700; letter-spacing: .45em; text-shadow: 0 3px 6px rgba(0,0,0,.4); }
      #loader .sub { font-size: clamp(12px, 3vw, 16px); opacity: .8; letter-spacing: .05em; }
      #loader .bar { width: min(70vw, 360px); height: 10px; border-radius: 6px; background: rgba(39,49,69,.9); border: 2px solid rgba(90,104,132,.8); overflow: hidden; }
      #loader .fill { width: 0; height: 100%; background: #ffb834; transition: width .2s ease; }
      #loader .house { width: 64px; height: 64px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader">
      <svg class="house" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M6 32 L32 8 L58 32 L52 32 L52 58 L12 58 L12 32 Z" fill="#f4eadc"/>
        <rect x="40" y="12" width="6" height="14" fill="#f4eadc"/>
        <rect x="22" y="36" width="10" height="10" fill="#ffc861"/>
      </svg>
      <div class="title">ДОМ НА НОЧЬ</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="sub">Загрузка… На телефоне можно играть и вертикально, и горизонтально</div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#fill");

      // Свайпы и двойной тап не должны двигать страницу.
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Размер картинки следует за размером холста (поворот, окно itch, полноэкранный режим).
        matchWebGLToCanvasSize: true,
        // Чёткость на телефонах, но не больше 2× — иначе слабые телефоны тормозят.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function () {
          loader.style.opacity = "0";
          setTimeout(function () { loader.remove(); }, 450);
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
